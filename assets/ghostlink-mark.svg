<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 261" role="img" aria-label="GhostLink">
  <title>GhostLink</title>
  <!--
    The primary mark from the GhostLink brand sheet: solid ghost, two signal
    arcs. Drawn in one colour via currentColor, with the eyes as evenodd holes
    rather than filled shapes, so the mark sits correctly on green-on-navy,
    black-on-cream, white-on-black — every variant the brief specifies — without
    needing a separate file per background.
  -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <path d="M41.3 46.9A70 70 0 0 1 158.7 46.9" stroke-width="20"/>
    <path d="M64.9 67.9A39 39 0 0 1 135.1 67.9" stroke-width="18"/>
  </g>
  <path fill="currentColor" fill-rule="evenodd" d="M20 159A80 80 0 0 1 180 159V243Q160 269 140 243Q120 269 100 243Q80 269 60 243Q40 269 20 243ZM58 156a16 16 0 1 0 32 0a16 16 0 1 0-32 0ZM110 156a16 16 0 1 0 32 0a16 16 0 1 0-32 0Z"/>
</svg>
